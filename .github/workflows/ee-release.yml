name: Release Execution Environments

on:
  release:
    types:
      - published

# Deny all permissions by default; each job grants only what its steps require.
permissions: {}

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      # Read the repository so checkout and release validation can access the source files.
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}

    steps:
      - name: Check out the release
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          version: "0.12.9"

      - name: Validate the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --locked --group scripts \
            execution-environments/scripts/validate_ee_release.py \
            "${RELEASE_TAG}" \
            execution-environments/community-ee-base/requirements-explicit.in \
            execution-environments/community-ee-minimal/requirements-explicit.in

  build:
    name: Build and publish ${{ matrix.name }}
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      # Read the repository so checkout can access the release source.
      contents: read
      # Push the built execution environment images to GHCR.
      packages: write
      # Mint the OIDC token required to obtain a Sigstore signing certificate.
      id-token: write
      # Persist the generated SBOM attestation in GitHub's attestations API.
      attestations: write
      # Create the artifact metadata storage record for the attested image.
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - community-ee-base
          - community-ee-minimal

    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release.outputs.commit }}

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          python-version: "3.14"

      - name: Build ${{ matrix.name }}
        env:
          EE_NAME: ${{ matrix.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --locked --only-group build \
            ansible-builder build -v 3 \
            --container-runtime podman \
            --tag "${EE_NAME}:${RELEASE_TAG}" "${EE_NAME}:latest"
        working-directory: execution-environments/${{ matrix.name }}

      - name: Test ${{ matrix.name }}
        env:
          CONTAINER_RUNTIME: podman
          EE_NAME: ${{ matrix.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --locked --group test \
            pytest -v \
            --ee-name "${EE_NAME}" \
            --image-ref "${EE_NAME}:${RELEASE_TAG}"

      - name: Generate SPDX SBOM for ${{ matrix.name }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.name }}:${{ github.event.release.tag_name }}
          format: spdx-json
          output-file: ${{ matrix.name }}.spdx.json
          # Keep this pinned alongside anchore/sbom-action@v0.24.3; update both together.
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.name }}
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ matrix.name }}
          tags: |
            ${{ github.event.release.tag_name }}
            latest
          registry: ghcr.io/${{ github.repository_owner }}

      - name: Attest SBOM for ${{ matrix.name }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ matrix.name }}.spdx.json
          push-to-registry: true

      - name: Verify image attestation
        env:
          EE_NAME: ${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify \
            "oci://ghcr.io/${{ github.repository_owner }}/${EE_NAME}@${IMAGE_DIGEST}" \
            --repo "${{ github.repository }}"

  announcement:
    name: Generate release announcements
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          version: "0.12.9"

      - name: Add announcements to workflow summary
        env:
          REGISTRY_NAMESPACE: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          minimal_digest=$(skopeo inspect --format '{{.Digest}}' \
            "docker://ghcr.io/${REGISTRY_NAMESPACE}/community-ee-minimal:${RELEASE_TAG}")
          base_digest=$(skopeo inspect --format '{{.Digest}}' \
            "docker://ghcr.io/${REGISTRY_NAMESPACE}/community-ee-base:${RELEASE_TAG}")

          uv run --locked --group scripts \
            execution-environments/scripts/generate_release_announcements.py \
            "${RELEASE_TAG}" \
            "${REGISTRY_NAMESPACE}" \
            execution-environments \
            --digest "community-ee-minimal=${minimal_digest}" \
            --digest "community-ee-base=${base_digest}" \
            >> "${GITHUB_STEP_SUMMARY}"
