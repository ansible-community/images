name: Release Ansible Community Execution Environments

on:
  release:
    types:
      - published

permissions: {}

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          version: "0.12.9"

      - name: Check the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project execution-environments/scripts/release_execution_environment.py validate-tag "${RELEASE_TAG}"

  build:
    name: Build and publish ${{ matrix.name }}
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - community-ee-base
          - community-ee-minimal

    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          python-version: "3.14"

      - name: Install dependencies
        run: sudo apt-get install --yes podman

      - name: Log in to GHCR
        env:
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "${PASSWORD}" | podman login ghcr.io --username "${USERNAME}" --password-stdin

      - name: Build, test, and publish the image
        env:
          EE_NAME: ${{ matrix.name }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --locked --project execution-environments/tests \
            execution-environments/scripts/release_execution_environment.py publish \
            --ee-name "${EE_NAME}" \
            --release-tag "${RELEASE_TAG}" \
            --image-name "${IMAGE_NAME}"
