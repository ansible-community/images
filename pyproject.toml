[project]
name = "ansible-community-images"
version = "0.0.0"
description = "Ansible Community Images"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
build = ["ansible-builder"]
dev = ["ruff"]
scripts = [
    "ansible-builder",
    "ansible-core",
    "PyYAML",
]
smoke-test = [
    "ansible-core",
    "ansible-navigator",
]
test = [
    "ansible-builder",
    "pytest",
    "pytest-container",
    "pytest-testinfra",
    "PyYAML",
]

[tool.uv]
# The repository is not an installable package; uv only manages its environments.
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["conftest"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["execution-environments/tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
